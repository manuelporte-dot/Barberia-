<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería Web - Agendamiento de Citas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a1a; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #2a2a2a; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1, h2 { text-align: center; color: #d4af37; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        select, input, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: none; box-sizing: border-box; }
        select, input { background: #333; color: #fff; border: 1px solid #555; }
        .grid-horarios { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .btn-hora { background: #444; color: #fff; cursor: pointer; border: 1px solid #666; text-align: center; transition: background 0.2s; }
        .btn-hora:hover { background: #b8962e; color: #000; }
        .btn-hora.seleccionado { background: #d4af37; color: #000; font-weight: bold; border-color: #fff; }
        .btn-confirmar { background: #d4af37; color: #000; font-weight: bold; margin-top: 25px; cursor: pointer; font-size: 16px; }
        .btn-confirmar:hover { background: #b8962e; }
    </style>
</head>
<body>

<div class="container">
    <h1>BARBERÍA WEB</h1>
    <h2>Agendamiento de Citas</h2>

    <form id="formReserva">
        <label for="servicio">1. Selecciona Servicio:</label>
        <select id="servicio" required>
            <option value="Corte de Cabello y Barba">Corte de Cabello y Barba ($35.000)</option>
            <option value="Corte Solo">Corte Solo ($25.000)</option>
            <option value="Arreglo de Barba">Arreglo de Barba ($15.000)</option>
        </select>

        <label for="barbero">2. Selecciona Barbero:</label>
        <select id="barbero" required>
            <option value="Carlos Mario Guerra">Carlos Mario Guerra</option>
            <option value="Manuel Santiago Porte">Manuel Santiago Porte</option>
        </select>

        <label for="fecha">3. Selecciona Fecha:</label>
        <input type="date" id="fecha" required>

        <label>4. Selecciona Horario:</label>
        <div class="grid-horarios" id="gridHorarios">
            <button type="button" class="btn-hora" data-hora="09:00 AM">09:00 AM</button>
            <button type="button" class="btn-hora" data-hora="10:00 AM">10:00 AM</button>
            <button type="button" class="btn-hora" data-hora="11:30 AM">11:30 AM</button>
            <button type="button" class="btn-hora" data-hora="02:00 PM">02:00 PM</button>
            <button type="button" class="btn-hora" data-hora="03:30 PM">03:30 PM</button>
            <button type="button" class="btn-hora" data-hora="05:00 PM">05:00 PM</button>
        </div>

        <button type="submit" class="btn-confirmar">CONFIRMAR RESERVA</button>
    </form>
</div>

<script>
    let horaSeleccionada = null;

    // Lógica para seleccionar visualmente la hora
    const botonesHora = document.querySelectorAll('.btn-hora');
    botonesHora.forEach(boton => {
        boton.addEventListener('click', function() {
            botonesHora.forEach(b => b.classList.remove('seleccionado'));
            this.classList.add('seleccionado');
            horaSeleccionada = this.getAttribute('data-hora');
        });
    });

    // Validación y envío del formulario
    document.getElementById('formReserva').addEventListener('submit', function(e) {
        e.preventDefault();

        if (!horaSeleccionada) {
            alert('Por favor, selecciona un horario disponible.');
            return;
        }

        const servicio = document.getElementById('servicio').value;
        const barbero = document.getElementById('barbero').value;
        const fecha = document.getElementById('fecha').value;

        alert(`¡Cita agendada con éxito!\n\nServicio: ${servicio}\nBarbero: ${barbero}\nFecha: ${fecha}\nHora: ${horaSeleccionada}`);
    });
</script>

</body>
</html>
