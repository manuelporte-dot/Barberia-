<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería Web - Sistema de Gestión, Citas y Pagos</title>
    <style>
        :root {
            --primary: #d4af37;
            --primary-hover: #b8962e;
            --bg-dark: #0f0f12;
            --card-bg: rgba(30, 30, 38, 0.85);
            --card-border: rgba(212, 175, 55, 0.2);
            --text-light: #f0f0f0;
            --text-muted: #a0a0a0;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --info: #17a2b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                linear-gradient(135deg, #0a0a0c 0%, #16161e 100%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(212, 175, 55, 0.1);
        }

        h1, h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 { font-size: 2rem; }
        h2 { font-size: 1.2rem; color: var(--text-muted); font-weight: 400; }

        /* Tarjetas de Estadísticas / Pagos */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(15, 15, 18, 0.8);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-card .stat-value {
            font-size: 1.4rem;
            color: var(--primary);
            font-weight: bold;
        }

        /* Estilos de Formularios */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary);
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="password"],
        input[type="date"],
        select {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 15, 18, 0.8);
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        /* Botones */
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #d4af37 0%, #aa8828 100%);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            margin-top: 15px;
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        /* Grid de Horarios */
        .grid-horarios {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .btn-hora {
            background: rgba(40, 40, 50, 0.8);
            color: #fff;
            padding: 10px;
            border: 1px solid #444;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .btn-hora:hover {
            background: var(--primary-hover);
            color: #000;
        }

        .btn-hora.seleccionado {
            background: var(--primary);
            color: #000;
            font-weight: bold;
            border-color: #fff;
        }

        /* Tabla de Reservas */
        .table-container {
            overflow-x: auto;
            margin-top: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: rgba(15, 15, 18, 0.6);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #333;
            font-size: 0.9rem;
        }

        th {
            background: rgba(212, 175, 55, 0.15);
            color: var(--primary);
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
        }

        .badge-pendiente { background: rgba(255, 193, 7, 0.2); color: var(--warning); border: 1px solid var(--warning); }
        .badge-completada { background: rgba(40, 167, 69, 0.2); color: var(--success); border: 1px solid var(--success); }
        .badge-pago { background: rgba(23, 162, 184, 0.2); color: var(--info); border: 1px solid var(--info); }
        .badge-sin-pago { background: rgba(220, 53, 69, 0.2); color: var(--danger); border: 1px solid var(--danger); }

        .btn-accion {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            background: var(--success);
            color: #fff;
            font-weight: bold;
        }

        /* Modal para elegir método de pago al finalizar */
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #22222a;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid var(--primary);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .oculto { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- PANTALLA 1: LOGIN -->
    <div id="seccionLogin">
        <h1>BARBERÍA WEB</h1>
        <h2>Iniciar Sesión</h2>
        <form id="formLogin">
            <div class="form-group">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" placeholder="Ej: admin o barbero" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Ingresar al Sistema</button>
        </form>
    </div>

    <!-- PANTALLA 2: PANEL PRINCIPAL -->
    <div id="seccionPanel" class="oculto">
        <h1>BARBERÍA WEB</h1>
        <h2>Panel de Gestión, Citas y Caja</h2>

        <!-- Resumen Financiero -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Recaudado Hoy</h3>
                <div class="stat-value" id="totalRecaudado">$0</div>
            </div>
            <div class="stat-card">
                <h3>Citas Completadas</h3>
                <div class="stat-value" id="countCompletadas">0</div>
            </div>
            <div class="stat-card">
                <h3>Citas Pendientes</h3>
                <div class="stat-value" id="countPendientes">0</div>
            </div>
        </div>

        <!-- Formulario de Agendamiento -->
        <form id="formReserva">
            <div class="form-group">
                <label for="servicio">1. Selecciona Servicio:</label>
                <select id="servicio" required>
                    <option value="Corte de Cabello y Barba" data-precio="35000">Corte de Cabello y Barba ($35.000)</option>
                    <option value="Corte Solo" data-precio="25000">Corte Solo ($25.000)</option>
                    <option value="Arreglo de Barba" data-precio="15000">Arreglo de Barba ($15.000)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="barbero">2. Selecciona Barbero:</label>
                <select id="barbero" required>
                    <option value="Carlos Mario Guerra">Carlos Mario Guerra</option>
                    <option value="Manuel Santiago Porte">Manuel Santiago Porte</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fecha">3. Selecciona Fecha:</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="form-group">
                <label>4. Selecciona Horario:</label>
                <div class="grid-horarios">
                    <button type="button" class="btn-hora" data-hora="09:00 AM">09:00 AM</button>
                    <button type="button" class="btn-hora" data-hora="10:00 AM">10:00 AM</button>
                    <button type="button" class="btn-hora" data-hora="11:30 AM">11:30 AM</button>
                    <button type="button" class="btn-hora" data-hora="02:00 PM">02:00 PM</button>
                    <button type="button" class="btn-hora" data-hora="03:30 PM">03:30 PM</button>
                    <button type="button" class="btn-hora" data-hora="05:00 PM">05:00 PM</button>
                </div>
            </div>

            <button type="submit" class="btn">Agendar Cita</button>
        </form>

        <!-- Tabla de Control e Informe de Pagos -->
        <h2 style="margin-top: 40px;">Informe de Citas y Pagos</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Cliente</th>
                        <th>Servicio y Precio</th>
                        <th>Barbero</th>
                        <th>Fecha y Hora</th>
                        <th>Método de Pago</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaReservasBody">
                    <!-- Se llena dinámicamente -->
                </tbody>
            </table>
        </div>

        <button type="button" class="btn btn-secondary" id="btnCerrarSesion">Cerrar Sesión</button>
    </div>
</div>

<!-- VENTANA MODAL PARA REGISTRAR PAGO AL FINALIZAR -->
<div id="modalPago" class="modal">
    <div class="modal-content">
        <h2>Finalizar Corte y Pagar</h2>
        <p id="infoCorteModal" style="margin: 15px 0; color: var(--text-muted);"></p>
        
        <div class="form-group" style="text-align: left;">
            <label for="metodoSeleccionado">Selecciona Método de Pago:</label>
            <select id="metodoSeleccionado">
                <option value="Efectivo">Efectivo</option>
                <option value="Tarjeta">Tarjeta</option>
                <option value="Nequi">Nequi</option>
            </select>
        </div>

        <button type="button" class="btn" id="btnConfirmarPago">Confirmar Pago y Cerrar Cita</button>
        <button type="button" class="btn btn-secondary" id="btnCancelarModal">Cancelar</button>
    </div>
</div>

<script>
    let horaSeleccionada = null;
    let usuarioActual = "";
    let totalRecaudado = 0;
    let citasCompletadas = 0;
    let citasPendientes = 0;
    let filaEnProceso = null;
    let precioEnProceso = 0;

    // Login
    document.getElementById('formLogin').addEventListener('submit', function(e) {
        e.preventDefault();
        usuarioActual = document.getElementById('usuario').value;
        document.getElementById('seccionLogin').classList.add('oculto');
        document.getElementById('seccionPanel').classList.remove('oculto');
        actualizarMetricas();
    });

    // Logout
    document.getElementById('btnCerrarSesion').addEventListener('click', function() {
        document.getElementById('seccionPanel').classList.add('oculto');
        document.getElementById('seccionLogin').classList.remove('oculto');
        document.getElementById('formLogin').reset();
    });

    // Selección de hora
    const botonesHora = document.querySelectorAll('.btn-hora');
    botonesHora.forEach(boton => {
        boton.addEventListener('click', function() {
            botonesHora.forEach(b => b.classList.remove('seleccionado'));
            this.classList.add('seleccionado');
            horaSeleccionada = this.getAttribute('data-hora');
        });
    });

    // Agendar Cita (Sin pago previo, estado Pendiente)
    document.getElementById('formReserva').addEventListener('submit', function(e) {
        e.preventDefault();

        if (!horaSeleccionada) {
            alert('Por favor, selecciona un horario disponible.');
            return;
        }

        const servicioSelect = document.getElementById('servicio');
        const servicioTexto = servicioSelect.value;
        const precioServicio = parseInt(servicioSelect.options[servicioSelect.selectedIndex].getAttribute('data-precio'));
        const barbero = document.getElementById('barbero').value;
        const fecha = document.getElementById('fecha').value;

        citasPendientes++;
        actualizarMetricas();

        const tbody = document.getElementById('tablaReservasBody');
        const nuevaFila = document.createElement('tr');

        // Guardamos el precio en un atributo para usarlo luego
        nuevaFila.setAttribute('data-precio', precioServicio);

        nuevaFila.innerHTML = `
            <td>${usuarioActual}</td>
            <td>${servicioTexto} ($${precioServicio.toLocaleString()})</td>
            <td>${barbero}</td>
            <td>${fecha} | ${horaSeleccionada}</td>
            <td><span class="badge badge-sin-pago">Pendiente de pago</span></td>
            <td><span class="badge badge-pendiente">Pendiente</span></td>
            <td><button class="btn-accion" onclick="abrirModalPago(this)">Finalizar Corte</button></td>
        `;

        tbody.appendChild(nuevaFila);
        alert('¡Cita agendada con éxito!');

        botonesHora.forEach(b => b.classList.remove('seleccionado'));
        horaSeleccionada = null;
        document.getElementById('formReserva').reset();
    });

    // Abrir Modal al hacer clic en Finalizar Corte
    function abrirModalPago(boton) {
        filaEnProceso = boton.closest('tr');
        const servicioInfo = filaEnProceso.cells[1].innerText;
        const clienteInfo = filaEnProceso.cells[0].innerText;
        precioEnProceso = parseInt(filaEnProceso.getAttribute('data-precio'));

        document.getElementById('infoCorteModal').innerText = `Cliente: ${clienteInfo} \n Servicio: ${servicioInfo}`;
        document.getElementById('modalPago').style.display = 'flex';
    }

    // Cancelar modal
    document.getElementById('btnCancelarModal').addEventListener('click', function() {
        document.getElementById('modalPago').style.display = 'none';
        filaEnProceso = null;
    });

    // Confirmar Pago al finalizar el corte
    document.getElementById('btnConfirmarPago').addEventListener('click', function() {
        const metodoElegido = document.getElementById('metodoSeleccionado').value;

        // Actualizar la fila con el pago y estado cumplida
        filaEnProceso.cells[4].innerHTML = `<span class="badge badge-pago">${metodoElegido} - $${precioEnProceso.toLocaleString()}</span>`;
        filaEnProceso.cells[5].innerHTML = '<span class="badge badge-completada">Cumplida</span>';
        filaEnProceso.cells[6].innerHTML = '-';

        // Actualizar métricas financieras
        totalRecaudado += precioEnProceso;
        citasPendientes--;
        citasCompletadas++;
        actualizarMetricas();

        // Cerrar modal
        document.getElementById('modalPago').style.display = 'none';
        filaEnProceso = null;
    });

    function actualizarMetricas() {
        document.getElementById('totalRecaudado').innerText = `$${totalRecaudado.toLocaleString()}`;
        document.getElementById('countCompletadas').innerText = citasCompletadas;
        document.getElementById('countPendientes').innerText = citasPendientes;
    }
</script>

</body>
</html>
